services:
  - type: web
    name: roles
    runtime: python
    branch: master
    region: virginia
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn core.wsgi:application
    healthCheckPath: /login/
    autoDeploy: true
    envVars:
      - key: DEBUG
        value: 'False'
      - key: USE_SQLITE
        value: 'false'
      - key: ALLOWED_HOSTS
        value: '*'
      - key: SECRET_KEY
        generateValue: true
      - key: POSTGRES_DB
        sync: false
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: POSTGRES_HOST
        sync: false
      - key: POSTGRES_PORT
        value: '5432'