services:
  - type: web
    name: roles
    runtime: python
    branch: master
    region: virginia
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py migrate --noinput && python manage.py collectstatic --noinput
    startCommand: gunicorn core.wsgi:application
    healthCheckPath: /login/
    autoDeploy: true
    envVars:
      - key: DEBUG
        value: 'False'
      - key: USE_SQLITE
        value: 'false'
      - key: ALLOWED_HOSTS
        value: '*'
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
