services:
  - type: web
    name: roles-backend
    runtime: python
    rootDir: frontend/backend
    branch: master
    region: virginia
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py migrate --noinput && python manage.py collectstatic --noinput && python manage.py seed_data
    startCommand: gunicorn core.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /login/
    autoDeploy: true
    envVars:
      - key: DEBUG
        value: 'False'
      - key: USE_SQLITE
        value: 'false'
      - key: ALLOWED_HOSTS
        value: '*'
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: roles-db
          property: connectionString

databases:
  - name: roles-db
    plan: free